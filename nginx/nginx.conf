events {
    worker_connections 1024;
}

http {
    upstream restaurant_service {
        server restaurant-service:8002;
    }

    upstream order_service {
        server order-service:8003;
    }

    upstream delivery_service {
        server delivery-service:8004;
    }

    upstream payment_service {
        server payment-service:8005;
    }

    upstream notification_service {
        server notification-service:8006;
    }

    server {
        listen 80;
        server_name _;

        # Health check
        location /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # Restaurant Service
        location /restaurants {
            proxy_pass http://restaurant_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Order Service
        location /orders {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Delivery Service
        location /deliveries {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /drivers {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Payment Service
        location /payments {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Notification Service
        location /notifications {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Info
        location / {
            return 200 '{"service":"SwiggyOps API Gateway","version":"1.0","routes":["/restaurants","/orders","/deliveries","/payments","/notifications"]}';
            add_header Content-Type application/json;
        }
    }
}