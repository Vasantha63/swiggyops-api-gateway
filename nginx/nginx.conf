events {
    worker_connections 1024;
}

http {
    upstream restaurant_service {
        server restaurant-service.swiggyops.svc.cluster.local:8002;
    }

    upstream order_service {
        server order-service.swiggyops.svc.cluster.local:8003;
    }

    upstream delivery_service {
        server delivery-service.swiggyops.svc.cluster.local:8004;
    }

    upstream payment_service {
        server payment-service.swiggyops.svc.cluster.local:8005;
    }

    upstream notification_service {
        server notification-service.swiggyops.svc.cluster.local:8006;
    }

    server {
        listen 80;
        server_name _;

        location /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location /restaurants {
            proxy_pass http://restaurant_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /orders {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /deliveries {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /drivers {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /payments {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /notifications {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 200 '{"service":"SwiggyOps API Gateway","version":"1.0"}';
            add_header Content-Type application/json;
        }
    }
}