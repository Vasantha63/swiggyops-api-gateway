# SwiggyOps API Gateway Helm Values

replicaCount: 2

image:
  repository: 654654435115.dkr.ecr.ap-south-1.amazonaws.com/swiggyops-api-gateway
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 80

resources:
  requests:
    memory: "64Mi"
    cpu: "250m"
  limits:
    memory: "128Mi"
    cpu: "500m"

probes:
  liveness:
    path: /health
    port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /health
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80